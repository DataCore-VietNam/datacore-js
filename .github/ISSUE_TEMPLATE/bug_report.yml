name: Bug report
description: Report a bug in @datacore/sdk
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug!
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js / runtime version
      placeholder: 'Node 20, Deno 1.40, etc.'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: typescript
